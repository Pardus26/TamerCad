name: TamerCAD CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create Source ZIP
        run: |
          zip -r tamercad-source.zip . \
            -x ".git/*" \
            -x "node_modules/*"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: tamercad-build
          path: |
            dist/
            tamercad-source.zip